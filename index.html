<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<meta name="description" content="UNKNOWN LIFEFORM — an encounter with an artificial organism.">
<title>UNKNOWN LIFEFORM / specimen 09</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap');
:root{color-scheme:dark;--ink:#050807;--paper:#d9e2d5;--dim:#718078;--acid:#c7ff9a;--mono:'DM Mono',monospace;--sans:'Space Grotesk',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper)}
body{font-family:var(--sans);touch-action:pan-y}
#stage{position:relative;width:100%;height:100%;height:100svh;min-height:420px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#14221b 0%,#09100c 42%,#050807 78%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");mix-blend-mode:screen}
header{position:absolute;z-index:3;top:0;left:0;right:0;padding:clamp(18px,3vw,34px) clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font:10px var(--mono);letter-spacing:.19em;color:#d6e0d3}
.brand span{display:block;margin-top:7px;color:#66766b;font-size:9px;letter-spacing:.12em}
#signal{font:9px var(--mono);letter-spacing:.13em;color:#819387;text-align:right}
#signal:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#a8ff8b;box-shadow:0 0 12px #a8ff8b;margin:0 9px 1px 0;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
footer{position:absolute;z-index:3;bottom:0;left:0;right:0;padding:22px clamp(18px,4vw,48px) max(22px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.instruction{font:9px var(--mono);letter-spacing:.12em;line-height:1.8;color:#829087;max-width:210px}
#state{font:9px var(--mono);letter-spacing:.13em;color:#b9cbbd;text-align:right}
#state small{display:block;color:#627268;margin-top:7px;font-size:8px}
#hint{position:absolute;z-index:4;left:50%;top:72%;transform:translate(-50%,-50%);font:9px var(--mono);letter-spacing:.16em;color:#c5e6c4;white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 0 15px #8bffa0;transition:opacity .5s}
#hint.show{opacity:.85}
#reveal{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#050807;transition:opacity 1.4s ease,visibility 1.4s}
#reveal.out{opacity:0;visibility:hidden;pointer-events:none}
.intro{text-align:center;padding:24px}
.intro .over{font:9px var(--mono);letter-spacing:.3em;color:#789084;margin-bottom:22px}
.intro h1{font-weight:400;font-size:clamp(36px,8vw,76px);line-height:.94;letter-spacing:-.07em;margin:0;color:#e2eee0}
.intro h1 em{font-style:normal;color:#9acb9c}
.intro p{font:10px/1.8 var(--mono);letter-spacing:.08em;color:#7c8d82;margin:24px auto 30px;max-width:300px}
#enter{appearance:none;border:1px solid #647d68;background:transparent;color:#d9ecd7;padding:14px 25px;font:10px var(--mono);letter-spacing:.19em;cursor:pointer;min-height:46px;transition:.25s}
#enter:active{background:#baff9b;color:#071009}
#enter:hover{border-color:#c7ff9a;box-shadow:0 0 24px #9bff8a22}
@media(max-width:600px){header{padding-top:max(18px,env(safe-area-inset-top))}footer{padding-bottom:max(20px,env(safe-area-inset-bottom))}.instruction{max-width:170px;font-size:8px}#signal{font-size:8px}.brand{font-size:9px}#stage{min-height:360px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="stage" aria-label="Interactive artificial organism">
<canvas id="life" aria-label="A luminous, breathing alien organism that responds to touch and pointer movement"></canvas><div id="grain"></div>
<header><div class="brand">FIELD NOTES / 09<span>UNCLASSIFIED ORGANISM</span></div><div id="signal">LIVE OBSERVATION</div></header>
<footer><div class="instruction">MOVE CLOSER TO OBSERVE<br>TOUCH THE SPECIMEN TO PROVOKE IT</div><div id="state">DORMANT<small>CONTACT: NONE</small></div></footer>
<div id="hint" aria-live="polite">IT NOTICED YOU</div>
<section id="reveal"><div class="intro"><div class="over">BIOLOGICAL ANOMALY / 09</div><h1>UNKNOWN<br><em>LIFEFORM</em></h1><p>It was not designed to be watched.<br>It learned to watch back.</p><button id="enter" type="button">BEGIN OBSERVATION</button></div></section>
</main>
<script>
(()=>{
const canvas=document.getElementById('life'),ctx=canvas.getContext('2d',{alpha:false}),stage=document.getElementById('stage');
const stateEl=document.getElementById('state'),hint=document.getElementById('hint');
let w=0,h=0,dpr=1,t=0,last=0,active=false,px=-1000,py=-1000,near=0,aggression=0,energy=0.5,phase=0,spores=[],ribbons=[],pulses=[],touching=false,hintTimer=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=stage.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.7);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed()}
function seed(){spores=[];ribbons=[];const cx=w*.5,cy=h*.51,scale=Math.min(w,h);for(let i=0;i<52;i++){const a=rand(0,Math.PI*2),rr=rand(.08,.48)*scale;spores.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,vx:rand(-.3,.3),vy:rand(-.3,.3),r:rand(1,3.8),life:rand(0,1),seed:rand(0,10)})}for(let i=0;i<9;i++)ribbons.push({a:i/9*Math.PI*2,offset:rand(-.6,.6),speed:rand(.2,.7),len:rand(.65,1.2)})}
function pointer(e){const r=canvas.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top;near=1;if(active){aggression=Math.min(1,aggression+.13);if(Math.random()<.12)burst(px,py,8)}}
function burst(x,y,n){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(.7,3.2);spores.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rand(1,3),life:1,seed:rand(0,9)})}if(spores.length>180)spores.splice(0,spores.length-180);pulses.push({x,y,r:5,a:1})}
function interact(e){const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;burst(x,y,24);aggression=1;energy=clamp(energy+.12,0,1);stateEl.innerHTML='DISTURBED<small>CONTACT: DETECTED</small>';hint.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),1600)}
canvas.addEventListener('pointermove',pointer,{passive:true});canvas.addEventListener('pointerdown',e=>{touching=true;interact(e)},{passive:true});canvas.addEventListener('pointerup',()=>touching=false,{passive:true});canvas.addEventListener('pointerleave',()=>{near=0;px=-1000;py=-1000},{passive:true});
document.getElementById('enter').addEventListener('click',()=>{active=true;document.getElementById('reveal').classList.add('out');burst(w*.5,h*.5,32);stateEl.innerHTML='AWAKE<small>CONTACT: ESTABLISHED</small>'});
function drawOrganism(dt){
const cx=w*.5,cy=h*.5,unit=Math.min(w,h)*.34,threat=clamp(aggression,0,1),breath=1+Math.sin(t*.0011)*.035+Math.sin(t*.00037)*.025;
const dx=px-cx,dy=py-cy,dist=Math.hypot(dx,dy),approach=clamp(1-dist/(unit*2.4),0,1)*near;
const leanX=approach*clamp(dx/unit,-.5,.5)*18,leanY=approach*clamp(dy/unit,-.5,.5)*18;
ctx.save();ctx.translate(cx+leanX,cy+leanY);ctx.rotate(Math.sin(t*.00023)*.035);
const bodyR=unit*breath*(1+threat*.07);
// outer translucent membrane
for(let layer=5;layer>=0;layer--){ctx.beginPath();const n=96,rad=bodyR*(.66+layer*.075);for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;const wave=Math.sin(a*3+t*.0005+layer)*.035+Math.sin(a*7-t*.00031)*.018+Math.sin(a*2+t*.0008)*.025;const rr=rad*(1+wave+Math.sin(a*5+phase)*.018);const x=Math.cos(a)*rr*(1+Math.sin(a*2+t*.0004)*.05),y=Math.sin(a)*rr*(.79+Math.cos(a*3+t*.00025)*.035);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fillStyle='rgba(50,116,77,'+(.035+layer*.009)+')';ctx.fill();ctx.strokeStyle='rgba(151,236,163,'+(.035+layer*.012)+')';ctx.lineWidth=1;ctx.stroke()}
const grad=ctx.createRadialGradient(-unit*.22,-unit*.25,unit*.03,0,0,unit);grad.addColorStop(0,'rgba(164,226,164,.19)');grad.addColorStop(.48,'rgba(35,106,71,.15)');grad.addColorStop(1,'rgba(4,19,13,.02)');
ctx.beginPath();ctx.ellipse(0,0,bodyR*.72,bodyR*.59,Math.sin(t*.0003)*.1,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
// internal veins / tendrils
ctx.globalCompositeOperation='screen';
for(let k=0;k<ribbons.length;k++){const q=ribbons[k],a=q.a+Math.sin(t*.00025*q.speed+k)*.16+threat*.12;const reach=unit*q.len*(.78+Math.sin(t*.0004+k)*.12);ctx.beginPath();for(let j=0;j<=44;j++){const f=j/44,spiral=a+f*(1.5+q.offset)+Math.sin(t*.0004+j*.1+k)*.12;const rr=reach*f;const x=Math.cos(spiral)*rr,y=Math.sin(spiral)*rr*.78;if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=k%3===0?'rgba(182,255,177,.48)':'rgba(91,190,126,.28)';ctx.lineWidth=1+Math.sin(t*.001+k)*.7;ctx.shadowBlur=12;ctx.shadowColor='#8effa1';ctx.stroke()}
ctx.shadowBlur=0;
// central sensory eye
const eyeX=clamp(dx*.055,-unit*.13,unit*.13),eyeY=clamp(dy*.055,-unit*.1,unit*.1);
ctx.beginPath();ctx.ellipse(0,0,unit*.23,unit*.17,0,0,Math.PI*2);ctx.fillStyle='rgba(2,12,8,.72)';ctx.fill();ctx.strokeStyle='rgba(165,245,169,.45)';ctx.lineWidth=1.2;ctx.stroke();
const eye=ctx.createRadialGradient(eyeX-unit*.025,eyeY-unit*.025,1,eyeX,eyeY,unit*.105);eye.addColorStop(0,'#e6ffd0');eye.addColorStop(.18,'#9aff9e');eye.addColorStop(.5,'#3eaa72');eye.addColorStop(1,'#092a1b');
ctx.beginPath();ctx.ellipse(eyeX,eyeY,unit*.09,unit*.115,0,0,Math.PI*2);ctx.fillStyle=eye;ctx.shadowBlur=24;ctx.shadowColor='#9cff9e';ctx.fill();ctx.shadowBlur=0;
ctx.beginPath();ctx.arc(eyeX,eyeY,unit*.032,0,Math.PI*2);ctx.fillStyle='#03110a';ctx.fill();
ctx.restore();
}
function frame(now){if(!active&&!reduced){requestAnimationFrame(frame);return}const dt=Math.min(32,now-(last||now));last=now;t+=dt;
ctx.fillStyle='rgba(4,9,7,.24)';ctx.fillRect(0,0,w,h);
const cx=w*.5,cy=h*.51,unit=Math.min(w,h)*.34;
drawOrganism(dt);
for(let i=spores.length-1;i>=0;i--){const p=spores[i];const dx=px-p.x,dy=py-p.y,d=Math.hypot(dx,dy)||1;const attract=near&&d<unit*1.6?(1-d/(unit*1.6))*.012:0;p.vx+=(-p.x+cx)*.000012+dx/d*attract+Math.sin(t*.0005+p.seed)*.006;p.vy+=(-p.y+cy)*.000012+dy/d*attract+Math.cos(t*.0006+p.seed)*.006;p.vx*=.992;p.vy*=.992;p.x+=p.vx*dt*.055;p.y+=p.vy*dt*.055;p.life-=dt*.000025;if(p.life<=0){spores.splice(i,1);continue}ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.6+p.life*.5),0,Math.PI*2);ctx.fillStyle='rgba(168,255,172,'+(.15+p.life*.55)+')';ctx.shadowBlur=9;ctx.shadowColor='#9bff9e';ctx.fill();ctx.shadowBlur=0}
for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.r+=dt*.09;p.a-=dt*.00065;if(p.a<=0){pulses.splice(i,1);continue}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle='rgba(164,255,172,'+p.a*.45+')';ctx.lineWidth=1;ctx.stroke()}
aggression*=Math.pow(.994,dt/16);if(!near){energy+=(.48-energy)*.001}phase+=dt*.0003;
if(active&&Math.random()<.012&&spores.length<95){const a=rand(0,Math.PI*2);burst(cx+Math.cos(a)*unit*.65,cy+Math.sin(a)*unit*.5,1)}
if(active&&Math.random()<.0018){stateEl.innerHTML=(aggression>.3?'ALERT':'OBSERVING')+'<small>CONTACT: '+(near?'TRACKED':'NONE')+'</small>'}
if(!reduced)requestAnimationFrame(frame);else{ctx.fillStyle='rgba(4,9,7,.24)';ctx.fillRect(0,0,w,h);drawOrganism(16)}}
new ResizeObserver(resize).observe(stage);resize();
ctx.fillStyle='#050807';ctx.fillRect(0,0,w,h);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
